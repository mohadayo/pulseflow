services:
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "${GATEWAY_PORT:-5000}:5000"
    environment:
      - ANALYTICS_URL=http://analytics-api:5001
      - PROCESSOR_URL=http://event-processor:5002
      - GATEWAY_PORT=5000
    depends_on:
      analytics-api:
        condition: service_healthy
      event-processor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  analytics-api:
    build: ./services/analytics-api
    ports:
      - "${ANALYTICS_PORT:-5001}:5001"
    environment:
      - ANALYTICS_PORT=5001
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  event-processor:
    build: ./services/event-processor
    ports:
      - "${PROCESSOR_PORT:-5002}:5002"
    environment:
      - PROCESSOR_PORT=5002
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
